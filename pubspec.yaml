name: plant_care_organizer
description: "Мобильный органайзер домашних растений (Вариант 7) - Flutter, Cubit, Isar, Realm, Dio, Freezed"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Стейт-менеджмент (по ТЗ: Cubit как легковесный BLoC для лабораторных)
  flutter_bloc: ^8.1.3

  # Основная БД: Isar (локальная реляционная NoSQL со связями и реактивными стримами)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2

  # Вспомогательное хранилище справочников: Realm SDK (семейства, удобрения)
  realm: ^1.6.0

  # Сетевой слой REST API к Perenual
  dio: ^5.4.1

  # Сериализация, иммутабельность и кодогенерация
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Аппаратные модули по ТЗ Варианта 7
  mobile_scanner: ^5.0.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # UI утилиты
  intl: ^0.19.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Кодогенераторы (build_runner)
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
