<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- App Icon Background (iOS Squircle style) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <!-- Gloss overlay -->
  <circle cx="160" cy="140" r="140" fill="#ffffff" opacity="0.08" />
  <!-- Sprout Icon -->
  <g filter="url(#shadow)" transform="translate(64, 64) scale(0.75)">
    <!-- Main stem -->
    <path d="M 256,430 C 256,290 230,170 360,110 C 330,230 270,320 256,430 Z" fill="url(#leafGrad)" />
    <!-- Left leaf -->
    <path d="M 250,290 C 130,280 70,170 90,80 C 180,80 230,190 250,290 Z" fill="#a7f3d0" />
    <!-- Right leaf -->
    <path d="M 260,220 C 370,190 420,110 400,40 C 310,50 270,140 260,220 Z" fill="#34d399" />
    <!-- Water drop -->
    <path d="M 370,300 C 370,280 395,245 395,245 C 395,245 420,280 420,300 C 420,314 409,325 395,325 C 381,325 370,314 370,300 Z" fill="#67e8f9" />
  </g>
</svg>
